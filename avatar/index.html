<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>数字人 · 5号选手</title>
<style>
  :root{
    --accent:#3ddc97;
    --accent-2:#39b6ff;
    --warn:#ff6b6b;
    --idle:#7a8ba0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;
    font-family:"Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;cursor:default;}
  /* 舞台：透明背景，数字人 + 光效 */
  #stage{position:fixed;inset:0;display:block;}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #glow{position:absolute;left:50%;bottom:0;width:120%;height:45%;
    transform:translateX(-50%);pointer-events:none;
    background:radial-gradient(ellipse at center bottom,rgba(61,220,151,.20),rgba(57,182,255,.10) 45%,transparent 72%);
    opacity:.9;transition:opacity .4s ease;}
  body.state-alert #glow{
    background:radial-gradient(ellipse at center bottom,rgba(255,107,107,.34),rgba(255,107,107,.12) 45%,transparent 72%);
    animation:pulse .9s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

  /* 顶部状态条 */
  #hud{position:absolute;left:0;right:0;top:0;padding:14px 18px;
    display:flex;align-items:center;gap:10px;pointer-events:none;}
  #dot{width:9px;height:9px;border-radius:50%;background:var(--idle);
    box-shadow:0 0 10px currentColor;flex:0 0 auto;transition:.3s;}
  #hud .name{font-size:14px;font-weight:600;color:#eaf6ff;letter-spacing:.5px;
    text-shadow:0 2px 10px rgba(0,0,0,.55);}
  #hud .role{font-size:11px;color:#9fb2c6;text-shadow:0 2px 8px rgba(0,0,0,.55);}
  #state{margin-left:auto;font-size:11px;padding:3px 10px;border-radius:999px;
    color:#cfe6ff;background:rgba(20,34,48,.55);border:1px solid rgba(120,170,210,.28);
    backdrop-filter:blur(6px);text-shadow:0 1px 6px rgba(0,0,0,.5);}

  /* 字幕气泡 */
  #caption{position:absolute;left:50%;bottom:74px;transform:translateX(-50%) translateY(8px);
    max-width:min(780px,86vw);padding:13px 20px;border-radius:14px;
    background:linear-gradient(180deg,rgba(16,28,40,.90),rgba(11,20,30,.94));
    border:1px solid rgba(90,160,200,.30);
    box-shadow:0 10px 34px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);
    color:#f2f9ff;font-size:17px;line-height:1.65;letter-spacing:.3px;
    opacity:0;transition:opacity .22s ease,transform .22s ease;pointer-events:none;
    white-space:pre-wrap;word-break:break-word;}
  #caption.on{opacity:1;transform:translateX(-50%) translateY(0);}
  #caption .who{display:block;font-size:11px;color:var(--accent);
    letter-spacing:1.5px;margin-bottom:5px;font-weight:700;opacity:.95;}
  #caption .caret{display:inline-block;width:8px;height:1em;vertical-align:-2px;
    background:var(--accent);opacity:.85;margin-left:2px;animation:blink .9s steps(1) infinite;}
  @keyframes blink{50%{opacity:0}}

  /* 报警横幅：压在最底部，字幕在其上方，两者永不重叠 */
  #alert{position:absolute;left:50%;bottom:20px;transform:translate(-50%,8px);
    max-width:min(700px,84vw);padding:7px 16px;border-radius:10px;font-size:12.5px;
    font-weight:700;letter-spacing:.4px;line-height:1.5;text-align:center;
    color:#fff;background:rgba(190,36,36,.92);border:1px solid rgba(255,140,140,.55);
    box-shadow:0 8px 28px rgba(200,30,30,.40);opacity:0;transition:.25s;pointer-events:none;}
  #alert.on{opacity:1;transform:translate(-50%,0);}

  /* 底部小工具条（仅调试显示） */
  #tip{position:absolute;right:14px;bottom:10px;font-size:10px;color:rgba(160,190,215,.45);
    pointer-events:none;}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(8,14,20,.92);color:#9fd6c4;font-size:13px;letter-spacing:2px;z-index:50;
    transition:opacity .45s ease;}
  #boot.hide{opacity:0;pointer-events:none;}
  #boot .bar{margin-top:12px;width:180px;height:2px;background:rgba(120,170,210,.2);overflow:hidden;border-radius:2px;}
  #boot .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease;}
</style>
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="glow"></div>
    <div id="hud">
      <span id="dot"></span>
      <span class="name">5号选手</span>
      <span class="role">AI 编程助手 / 智能运维工程师</span>
      <span id="state">待机</span>
    </div>
    <div id="alert">警报：模型性能异常</div>
    <div id="caption"><span class="who">5号选手</span><span id="capText"></span></div>
    <div id="tip">数字人 v0.1</div>
  </div>
  <div id="boot"><div style="text-align:center">数字人形象加载中<div class="bar"><i id="bootBar"></i></div></div></div>
  <script src="./dist/avatar.bundle.js"></script>
</body>
</html>
