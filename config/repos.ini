; ============================================================
;  数字人依赖的项目登记表
;  ------------------------------------------------------------
;  跑一次看全貌：
;     .venv\Scripts\python.exe _tools\repos.py --report
;  生成给评委/同事看的清单：
;     .venv\Scripts\python.exe _tools\repos.py --manifest
;
;  path 里的占位符：
;     %ROOT%           本仓库（数字人）
;     @PROD_ROOT       config\paths.ini 里的 PROD_ROOT（指向 new mcjc 本身）
;     @PROD_SIBLING    PROD_ROOT 的父目录（aa比赛项目\）
;     @DATASET_ROOT    config\paths.ini 里的 DATASET_ROOT
;
;  git 字段的三种取值：
;     yes      已有仓库（别在这里 git init，去它自己的目录管）
;     local    还没有仓库 —— 可以 python _tools\repos.py --init <key> 建本地仓库
;     none     不建仓库（GB 级数据/二进制，只登记路径）
; ============================================================

[self]
name = 数字人（本项目）
role = 主体：小星形象 + 主服务 8772 + 启动编排 + 部署工具
path = %ROOT%
git = yes
web_github = https://github.com/shenfu820/mcszr
web_gitee = https://gitee.com/shenfu1314/mcszr
ssh_github = git@github-mcszr:shenfu820/mcszr.git
https_gitee = https://gitee.com/shenfu1314/mcszr.git
pull = git pull github master && git pull origin master
push = 双击 推送到两个仓库.bat
size = 仓库本体几 MB（.venv / models / _tools 大件已 gitignore）
required = yes
note = 两个远端同一个 master；github 走 ssh.github.com:443（这台机器直连 443 会被重置），别名在 ~/.ssh/config 的 github-mcszr

[prod]
name = 产线工程 new mcjc
role = ①② 屏本体：桌面端 run.py + 大屏 screen_service.py + 检测库 data\wood_inspect.db
path = @PROD_ROOT
git = yes
web_gitee_origin = https://gitee.com/shenfu1314/wood-testing
web_gitee_inspection = https://gitee.com/linyi-vocational-college/inspection
https_origin = https://gitee.com/shenfu1314/wood-testing.git
https_inspection = https://gitee.com/linyi-vocational-college/inspection.git
size = 45.7 GB（output 34.8 GB / data 1.3 GB / models 1.2 GB / .venv 319 MB / screen 101 MB）—— 不进数字人仓库
required = no
note = 不是数字人的子目录，靠 config\paths.ini 的 PROD_ROOT 找；clone 下来只有代码，权重与库要另外拷（见 docs\仓库与依赖清单.md）

[stage]
name = 四屏舞台包
role = ① 抓帧 + ④ 自学习聚合（8790 stage_server.py）
path = %ROOT%\板材数字人_四屏舞台_20261113
git = yes
size = 数十 MB（06_验收截图 39 MB 已 gitignore）
required = yes
note = 跟着本仓库走，不单独建仓库

[agent]
name = 对话中枢 angent
role = ③ 屏本体：8999 agent_service.py + web 前端
path = @PROD_SIBLING\angent
git = yes
web_gitee = https://gitee.com/shenfu1314/mcangent
https_gitee = https://gitee.com/shenfu1314/mcangent.git
size = 代码 0.6 MB；data\angent.db(-wal) 4.3 MB、screenshots 3.1 MB 不入库
ignore = __pycache__/|*.pyc|*.pyo|logs/|screenshots/|data/*.db|data/*.db-shm|data/*.db-wal|*.log
required = no
note = 2026-11-15 推到 gitee/mcangent（master，40 个文件）；clone 下来就能直接跑，数据库与截图是运行产物不入库

[dataset]
name = 板材缺陷数据集（6 类）
role = 训练/评估的数据源（gpu_worker 生成 data.yaml 指向它）
path = @DATASET_ROOT
git = none
size = GB 级（3000+ 张）—— 不建仓库
required = no
note = 只登记路径；目录结构要 images\{train,val} + labels\{train,val}；启动脚本会按它建 C:\dh_ds 软链绕开中文路径

; ------------------------------------------------------------
;  以下是"周围那几个系统"，不在五块屏链路里，但同属这套项目，
;  以前一个都没有仓库。按用户要求：git=local 的可以用
;     python _tools\repos.py --init-missing --yes
;  一次性补建成本地仓库。
; ------------------------------------------------------------

[defect]
name = 早期缺陷系统 defect_system
role = 早期版本的缺陷运行/复核原型（现在以 new mcjc 为准，留着做对照）
path = @PROD_SIBLING\defect_system
git = local
ignore = __pycache__/|*.pyc|*.log
size = 0.1 MB（10 个文件）
required = no
note = 归档用；--init-missing 会建成本地仓库

[keyboard]
name = CodeMender 键盘工具 keyboard_tool
role = 桌面小工具：pycharm 桥接 + 快速改码（以前只在本机某个目录）
path = @PROD_SIBLING\keyboard_tool
git = local
ignore = __pycache__/|*.pyc|*.rar|*.model|*.dat|*.log|dist/|build/|*.spec.bak
size = 465 MB（其中 pycharm_plugin.rar 82.9 MB、flcc.model 65.5 MB、content.dat 64 MB 不入库）
required = no
note = 代码入库，压缩包/模型数据按 .gitignore 排除

[training]
name = 训练脚本 Training
role = 数据集训练/评估脚本（train_wood.py / run_all.bat）
path = @PROD_SIBLING\Training
git = local
ignore = __pycache__/|*.pyc|*.pt|*.pth|*.zip|*.onnx|runs/|datasets/|*.log|木材缺陷数据集6类3000+/|weights/|*.part
size = 7.2 GB（epoch*.pt 各 125 MB、数据集 zip 140 MB —— 全部不入库，只留脚本）
required = no
note = 权重与数据集不入库；要复现就在产线机上直接跑
