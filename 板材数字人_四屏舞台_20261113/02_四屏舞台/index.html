<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e0f11'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23d98a3d'/%3E%3C/svg%3E">
<title>板材数字人 · 四屏舞台</title>
<link rel="stylesheet" href="css/stage.css">
</head>
<body>
<div id="stage" class="stage">

  <canvas id="bg" class="bg"></canvas>
  <div class="bg-vignette"></div>
  <div class="bg-floor"></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div class="titles">
        <h1 id="sysTitle">木材/板材表面缺陷智能检测系统</h1>
        <p id="sysTitleEn">Wood Board Surface Defect Intelligent Inspection Platform</p>
      </div>
    </div>
    <div class="pillbox">
      <span class="pill" id="pillSource">数据源：快照</span>
      <span class="pill" id="pillDb">库 —</span>
      <span class="pill" id="pillModel">模型 —</span>
      <span class="pill time" id="clock">--:--:--</span>
    </div>
  </header>

  <main class="deck" id="deck">
    <svg class="beams" id="beams" viewBox="0 0 1920 1080" preserveAspectRatio="none"></svg>

    <div class="avatar-wrap" id="avatarWrap">
      <div class="avatar-glow"></div>
      <canvas id="avatar" class="avatar"></canvas>
      <div class="plinth"><i></i></div>
    </div>

    <article class="panel" id="p-inspect" data-key="inspect"></article>
    <article class="panel" id="p-screen"  data-key="screen"></article>
    <article class="panel" id="p-review"  data-key="review"></article>
    <article class="panel" id="p-learn"   data-key="learn"></article>
  </main>

  <div class="legend" id="legend"></div>

  <div class="subtitle" id="subtitle">
    <span class="who">小星</span>
    <p id="subText">正在接入产线数据…</p>
    <span class="speaking" id="speaking" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
  </div>

  <div class="hint">1 / 2 / 3 / 4 切屏讲解 · 空格 下一条 · A 自动轮播</div>
</div>

<script src="js/character.js"></script>
<script src="js/panels.js"></script>
<script src="../03_数据/snapshot.js"></script>
<script src="../04_台词配音/script.js"></script>
<script src="js/stage.js"></script>
</body>
</html>
