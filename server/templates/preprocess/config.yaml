# 图像预处理参数（全部外置，代码里不写死）
# 依据：线扫相机 8K / 曝光 15μs / 45°侧光 采集的板材表面图

input_dir: ../../samples/raw
output_dir: ../../samples/preprocessed
log_file: preprocess.log

denoise:
  method: gaussian        # gaussian | median | bilateral
  kernel: [5, 5]          # 必须奇数；核越大越柔，细节越容易糊
  sigma: 1.0

enhance:
  method: clahe           # clahe | equalize | none
  clip_limit: 2.0         # 对比度上限，太大易放大噪点
  tile_grid: [8, 8]       # 分块大小：小缺陷建议 8×8，粗纹理可试 16×16
  channel: ycrcb          # 只对亮度通道做，避免色彩畸变

normalize:
  to_float: true          # true → [0,1] float32（训练用）；false → 保持 uint8（保存用）
  save_preview: true      # 是否另存处理前后对比图

split:
  train: 0.7
  val: 0.2
  test: 0.1
  seed: 42
  # 同一块板的多个切片必须落在同一个集合，避免数据泄漏
  group_by: board_id

dedup:
  enabled: true
  # 用感知哈希粗筛重复图，阈值越小判得越严
  hamming_threshold: 4
